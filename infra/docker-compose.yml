services:
  postgres:
    image: postgres:16
    container_name: ticketing_postgres
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - ticketing_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    container_name: ticketing_backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend/streamlit_app
    container_name: ticketing_frontend
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  ticketing_postgres_data: